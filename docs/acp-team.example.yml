# Example workspace team file for dsh-acp-resume (D27).
# Copy to <workspace root>/.agents/acp-team.yml and edit. The plugin looks for
# it from the session's working directory upward (that directory, its parent,
# and its grandparent). Blueprints only: chats are created per DSH session on
# first reference and listed by acp_chat_list with a `role` column.

roles:
  # name: [A-Za-z0-9_-]{1,32}, unique. Address it as `role: reviewer` in
  # acp_chat_send / acp_chat_close / acp_chat_steer, or from a template step.
  - name: reviewer
    # backend: optional; a configured backend name (omit for the default backend).
    # cwd: optional; relative paths resolve against the workspace root (default: the root itself).
    cwd: .
    # seeding: optional; sent once as the first turn of a newly created chat.
    seeding: |
      You are the code reviewer for this repository. Review only; do not edit files.
      Report findings as a numbered list, most severe first, each with file and line.

  - name: security-reviewer
    seeding: |
      You review code for security issues only: injection, auth, secrets, unsafe defaults.

  - name: researcher
    seeding: |
      You are a researcher. Answer with sources; say clearly when something is unverified.

  - name: editor
    seeding: |
      You merge several reviews into one: deduplicate, keep every distinct finding,
      and flag where reviewers disagree.

# Templates are run by the acp_workflow tool: acp_workflow(template, params).
# Steps run in order. A `parallel` step sends its prompt to each listed role at
# once; a role entry may carry its own prompt. Placeholders: {param} is a call
# param, {stepId} is an earlier step's results; a prompt naming no earlier step
# gets the previous step's results appended. A `merge` step either ends the run
# and returns everything to the model (`return_to_model`, last step only) or
# sends all earlier results to one role (`role`, with an optional prompt).
templates:
  - name: dual_review
    description: Two independent reviews of the same target, merged by the editor role.
    params: [target, dimensions]
    steps:
      - id: independent
        parallel:
          - reviewer
          - { role: security-reviewer, prompt: "Review {target} for security issues." }
        prompt: "Review {target}. Focus on: {dimensions}."
      - id: merge
        merge: { mode: role, role: editor, prompt: "Merge these reviews of {target} into one list." }

  - name: research_then_review
    description: Research best practice first, then review against it; results come back to the model.
    params: [target]
    steps:
      - id: research
        parallel: [researcher]
        prompt: "What is current best practice for code like {target}?"
      - id: review
        parallel: [reviewer]
        prompt: "Review {target} against this research: {research}"
      - id: done
        merge: { mode: return_to_model }
