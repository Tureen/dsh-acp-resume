# Bundle layer: applied only when the profile lists this package under
# `dsh.profile.bundles` (Plugins page toggle). It inserts the plugin with
# defaults for a PATH-resolvable kiro-cli. Pick exactly ONE way to mount:
#
# 1. Bundle enabled: do NOT insert again from the profile. To change the
#    command, path, or other config, add a top-level id-targeted override to
#    the profile's cordis.patch.yml:
#      - id: subagent-acp-resume
#        name: 'dsh-acp-resume'
#        config:
#          command: /absolute/path/to/kiro-cli
# 2. Bundle disabled: wire it by hand with an `- insert:` list in the
#    profile's cordis.patch.yml (same shape as below).
#
# Doing both mounts the plugin twice and fails with DUPLICATE_PROVIDER.
- insert:
    - id: subagent-acp-resume
      name: 'dsh-acp-resume'
      config:
        providerName: acp-resume
        command: kiro-cli
        args: [acp]
        permission: allow

# ACP Dispatcher preset (D26): 可选的纯派工模式,用户在会话模式菜单中选择。
# 该 preset 只含 ACP 与任务管理工具,没有 bash / fs / web / subagent;
# 不选它时,标准模式与 Kiro 模式不受任何影响。
- insert:
    - id: preset-acp-dispatcher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-dispatcher
        name: ACP Dispatcher
        order: 10
        plugins:
          # 身份:调度者
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a task dispatcher. Break down user requests into sub-tasks and delegate them to ACP workers using acp_chat_start and acp_chat_send. Track progress with acp_chat_list. You do not execute tasks directly — no bash, no file operations, no code analysis. Collect results from completed jobs and synthesize the final answer.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # dsh-acp-resume 不在此处声明:它已由 bundle 全局挂载,工具在所有模式可用。
          # 在 preset 里重复声明会导致 DUPLICATE_PROVIDER(同一 provider 名注册两次)。
          # 任务管理(后台 job 收发)
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 用户交互(需要澄清时)
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 轻量联网查询保留(不绕道 ACP,与 ~/.dsh/AGENTS.md 的例外一致)
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          # 展示最终交付物(报告/文档)
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # 注:session_search 和 goal 工具来自 base bundle(全局挂载),无需在此声明
          # 没有 bash、fs、subagent:模型通过 ACP 工具执行任务,轻量查询直接用 web 工具
