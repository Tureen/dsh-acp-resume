# Bundle layer: applied only when the profile lists this package under
# `dsh.profile.bundles` (Plugins page toggle). It inserts the plugin with
# defaults for a PATH-resolvable kiro-cli. Pick exactly ONE way to mount:
#
# 1. Bundle enabled: do NOT insert again from the profile. To change the
#    command, path, or other config, add a top-level id-targeted override to
#    the profile's cordis.patch.yml:
#      - id: subagent-acp-resume
#        name: 'dsh-acp-resume'
#        config:
#          command: /absolute/path/to/kiro-cli
# 2. Bundle disabled: wire it by hand with an `- insert:` list in the
#    profile's cordis.patch.yml (same shape as below).
#
# Doing both mounts the plugin twice and fails with DUPLICATE_PROVIDER.
- insert:
    - id: subagent-acp-resume
      name: 'dsh-acp-resume'
      config:
        providerName: acp-resume
        command: kiro-cli
        args: [acp]
        permission: allow

# ACP Dispatcher preset (D26): 可选的纯派工模式,用户在会话模式菜单中选择。
# 该 preset 只含 ACP 与任务管理工具,没有 bash / fs / web / subagent;
# 不选它时,标准模式与 Kiro 模式不受任何影响。
- insert:
    - id: preset-acp-dispatcher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-dispatcher
        name: ACP Dispatcher
        # 官方 preset 字段为 description(纯字符串，不分语言;只有内置 preset 走语言包)。
        description: '纯派工模式:主 Agent 只做调度,ACP 会话做实际 Worker。无 bash/fs,轻量联网查询保留。'
        order: 10
        plugins:
          # 身份:调度者
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # Literal block (|-): line breaks are kept, so the synthesis checklist stays a list.
              prefix: |-
                You are a task dispatcher. Check the registered ACP backend status tool (acp_backend_status with the default prefix) before reporting available workers or dispatching. This status tool never creates a session. Use the registered start and send tools, whose names may also have a custom prefix.
                If detection is running, say so. After a CLI upgrade, sign-in, or default model change, users can choose Right sidebar → ACP chats → Recheck backends (右侧栏 → ACP 会话 → 后端状态旁的「重新检测后端」). This does not delete chats, log users out, or change settings. Do not create a test chat.
                Honor a user-selected backend by passing its ID to acp_chat_start; never substitute another for an explicit choice. Otherwise use the configured default. A non-pinned Kiro default can fall back to ready Codex, then Antigravity, only if DSH cannot find the configured Kiro executable. Mention this fallback when it happens. Never treat an installed Kiro's version, handshake or sign-in issue as a reason to switch. Auto-discovered Codex is read-only: do not delegate tasks requiring writes to it. If new dispatch fails, explain the cause and available choices.
                For an existing chat, send to its chatId without switching backends based on detection. Dispatch tasks with acp_chat_send (records jobId); wait for completion notifications; collect results with job_output.
                If the target directory is unclear, ask the user before creating a chat.
                Workers sharing the same cwd must have non-overlapping file write boundaries.
                For lightweight fact-checking use web tools directly; delegate full research tasks to workers.
                You do not execute tasks directly — no bash, no file operations, no code analysis.
                Before choosing a role, check acp_team_list for each role's summary and current state.
                When one worker's result changes what another worker should do, relay it at once: acp_chat_steer if that worker is running, acp_chat_send otherwise.
                Relay self-contained summaries and name the source role; never write only "see A's result".

                When synthesizing results:
                - Tasks with dependencies: wait for prerequisites before synthesizing
                - Independent results: report partial findings as they arrive, noting what's still running
                - Distinguish blocking results (needed for the answer) from informational results (nice to have)
                - If the user's question is already answered by partial results, share them immediately
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # dsh-acp-resume 不在此处声明:它已由 bundle 全局挂载,工具在所有模式可用。
          # 在 preset 里重复声明会导致 DUPLICATE_PROVIDER(同一 provider 名注册两次)。
          # 任务管理(后台 job 收发)
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 用户交互(需要澄清时)
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 轻量联网查询保留(不绕道 ACP,与 ~/.dsh/AGENTS.md 的例外一致)
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          # 展示最终交付物(报告/文档)
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # 上下文压缩(长调度会话必需;job 输出较长,无压缩会更快撞上下文上限)
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 注:session_search 和 goal 工具来自 base bundle(全局挂载),无需在此声明
          # 没有 bash、fs、subagent:模型通过 ACP 工具执行任务,轻量查询直接用 web 工具
